<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Student Registration</h1>
    <p class="intro">Enter your details below.</p>

    <form id="studentForm">
      <label for="studentID">Student ID</label>
      <input id="studentID" name="studentID" required>

      <label for="studentName">Full name</label>
      <input id="studentName" name="studentName" autocomplete="name" required>

      <label for="programme">Programme</label>
      <input id="programme" name="programme" required>

      <label for="year">Year of study</label>
      <input id="year" name="year" type="number" min="1" max="8" required>

      <button type="submit">Save registration</button>
    </form>

    <p id="message" role="status"></p>
    <h2>Saved students</h2>
    <ul id="studentList"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
